      Passive: "0" #  or "0" in the keyboard
      Velocity: "2" #  or "2" in the keyboard
      Velocity_LowerBody: "c" #  or "c" in the keyboard

    motion_file: config/policy/mimic/move_arms_gvhmr/params/move_arms_gvhmr.npz
    policy_dir: config/policy/mimic/move_arms_gvhmr/
    time_start: 0.0
    time_end: 1000.0

  HipHop:
    transitions:
      Passive: "0" #  or "0" in the keyboard
      Velocity: "2" #  or "2" in the keyboard
      Velocity_LowerBody: "c" #  or "c" in the keyboard

    motion_file: config/policy/mimic/hiphop/params/hiphop_gvhmr.npz
    policy_dir: config/policy/mimic/hiphop/
    time_start: 0.0
