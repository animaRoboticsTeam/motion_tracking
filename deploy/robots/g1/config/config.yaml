    policy_dir: config/policy/mimic/lafan1_dance1_subject2/
    time_start: 0.0
    time_end: 1000.0

  Mimic_Squat:
    transitions:
      Passive: "0" #  or "0" in the keyboard
      Velocity: "2" #  or "2" in the keyboard
      Velocity_LowerBody: "c" #  or "c" in the keyboard

    motion_file: config/policy/mimic/squat_gvhmr/params/squat_gvhmr.npz
    policy_dir: config/policy/mimic/squat_gvhmr/
    time_start: 0.0
    time_end: 1000.0

  Mimic_Move_Arms:
